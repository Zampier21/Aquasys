[pytest]
testpaths = tests
pythonpath = .

# Os avisos abaixo vêm de dependências e do estilo antigo de algumas
# partes do projeto. Não escondem falha de teste — só tiram ruído da
# saída, que é o que se lê quando algo quebra.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
