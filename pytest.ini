[pytest]
testpaths = tests
pythonpath = .

# O teste marcado com `rede` baixa nove megabytes da FishBase e fica
# fora da suíte normal. Serve para conferir, de vez em quando, se o
# endereço e os nomes das colunas continuam os mesmos:
#   python -m pytest -m rede
markers =
    rede: bate em serviço externo de verdade
addopts = -m "not rede"

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
