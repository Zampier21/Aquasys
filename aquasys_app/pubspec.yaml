name: aquasys_app
description: "AquaSys — Sistema de Gerenciamento de Aquários"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  youtube_player_iframe: ^6.0.2
  # Escolher a foto de perfil / logo. Redimensiona no próprio aparelho
  # antes de enviar, então não sobe imagem de câmera inteira.
  image_picker: ^1.2.3
  cached_network_image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/