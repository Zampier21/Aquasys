<svg xmlns="http://www.w3.org/2000/svg" width="940" height="812" viewBox="0 0 940 812" font-family="Arial, Helvetica, sans-serif">
  <rect width="940" height="812" fill="#ffffff"/>

  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#5A6B7B"/>
    </marker>
    <marker id="setaInicio" markerWidth="10" markerHeight="10" refX="1" refY="4" orient="auto">
      <path d="M9,0 L0,4 L9,8 z" fill="#5A6B7B"/>
    </marker>
  </defs>

  <!-- ══════════ USUÁRIOS ══════════ -->
  <rect x="250" y="18" width="200" height="46" rx="23" fill="#EAF2FA" stroke="#8FB4D4" stroke-width="1.5"/>
  <text x="350" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A52">Loja assinante</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#4A6076">perfil CNPJ</text>

  <rect x="490" y="18" width="200" height="46" rx="23" fill="#EAF2FA" stroke="#8FB4D4" stroke-width="1.5"/>
  <text x="590" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A52">Cliente da loja</text>
  <text x="590" y="56" text-anchor="middle" font-size="12" fill="#4A6076">perfil CPF</text>

  <line x1="350" y1="64" x2="400" y2="96" stroke="#5A6B7B" stroke-width="1.5" marker-end="url(#seta)"/>
  <line x1="590" y1="64" x2="540" y2="96" stroke="#5A6B7B" stroke-width="1.5" marker-end="url(#seta)"/>

  <!-- ══════════ CAMADA 1 — APRESENTAÇÃO ══════════ -->
  <rect x="60" y="100" width="820" height="176" rx="10" fill="#F4F9FD" stroke="#5A8FBF" stroke-width="2"/>
  <text x="82" y="128" font-size="15" font-weight="bold" fill="#1F3A52">1. CAMADA DE APRESENTAÇÃO</text>
  <text x="82" y="147" font-size="12.5" fill="#4A6076">Flutter (Dart) — executa no aparelho do usuário · base de código única para Android e iOS</text>

  <rect x="82" y="162" width="180" height="52" rx="6" fill="#ffffff" stroke="#8FB4D4" stroke-width="1.3"/>
  <text x="172" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A52">Telas</text>
  <text x="172" y="200" text-anchor="middle" font-size="11" fill="#5A6B7B">exibem o que a API decidiu</text>

  <rect x="278" y="162" width="180" height="52" rx="6" fill="#ffffff" stroke="#8FB4D4" stroke-width="1.3"/>
  <text x="368" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A52">Widgets</text>
  <text x="368" y="200" text-anchor="middle" font-size="11" fill="#5A6B7B">componentes reutilizáveis</text>

  <rect x="474" y="162" width="180" height="52" rx="6" fill="#ffffff" stroke="#8FB4D4" stroke-width="1.3"/>
  <text x="564" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A52">Serviços</text>
  <text x="564" y="200" text-anchor="middle" font-size="11" fill="#5A6B7B">acesso à API por domínio</text>

  <rect x="670" y="162" width="188" height="52" rx="6" fill="#ffffff" stroke="#8FB4D4" stroke-width="1.3"/>
  <text x="764" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A52">Tema</text>
  <text x="764" y="200" text-anchor="middle" font-size="11" fill="#5A6B7B">cores, tipografia, espaçamento</text>

  <rect x="82" y="224" width="776" height="38" rx="6" fill="#E3EFF8" stroke="#5A8FBF" stroke-width="1.3"/>
  <text x="470" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3A52">Api — cliente HTTP único: monta a requisição, anexa o token, traduz o erro</text>

  <text x="470" y="292" text-anchor="middle" font-size="12.5" font-style="italic" fill="#B03A2E">Não contém regra de negócio</text>

  <!-- ══════════ COMUNICAÇÃO ══════════ -->
  <line x1="440" y1="300" x2="440" y2="352" stroke="#5A6B7B" stroke-width="2" marker-end="url(#seta)" marker-start="url(#setaInicio)"/>
  <rect x="470" y="304" width="392" height="46" rx="6" fill="#FBF7EC" stroke="#D9B979" stroke-width="1.3"/>
  <text x="666" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7A5B12">API REST sobre HTTPS · token JWT em cada requisição</text>
  <text x="666" y="340" text-anchor="middle" font-size="11.5" fill="#8A6D2A">requisições autocontidas — servidor sem estado de sessão</text>

  <!-- ══════════ CAMADA 2 — LÓGICA DE NEGÓCIO ══════════ -->
  <rect x="60" y="358" width="820" height="282" rx="10" fill="#F2FAF6" stroke="#3E8E6B" stroke-width="2"/>
  <text x="82" y="386" font-size="15" font-weight="bold" fill="#14503A">2. CAMADA DE LÓGICA DE NEGÓCIO</text>
  <text x="82" y="405" font-size="12.5" fill="#2F6B52">FastAPI (Python) — monolito modular, replicável horizontalmente</text>

  <rect x="82" y="420" width="776" height="42" rx="6" fill="#ffffff" stroke="#7FBFA3" stroke-width="1.3"/>
  <text x="100" y="438" font-size="13" font-weight="bold" fill="#14503A">Rotas</text>
  <text x="100" y="454" font-size="11.5" fill="#4A7A64">recebem a requisição, verificam a autorização e delegam — 47 rotas, sem regra de negócio</text>

  <rect x="82" y="470" width="776" height="42" rx="6" fill="#ffffff" stroke="#7FBFA3" stroke-width="1.3"/>
  <text x="100" y="488" font-size="13" font-weight="bold" fill="#14503A">Contratos</text>
  <text x="100" y="504" font-size="11.5" fill="#4A7A64">validam entrada e saída antes de a regra ser executada (Pydantic)</text>

  <rect x="82" y="520" width="776" height="52" rx="6" fill="#E6F5EE" stroke="#3E8E6B" stroke-width="1.6"/>
  <text x="100" y="540" font-size="13" font-weight="bold" fill="#14503A">Serviços de domínio</text>
  <text x="100" y="557" font-size="11.5" fill="#2F6B52">avaliação de parâmetros · compatibilidade entre espécies · dicas · imagens — independentes de HTTP</text>

  <rect x="82" y="582" width="776" height="42" rx="6" fill="#ffffff" stroke="#7FBFA3" stroke-width="1.3"/>
  <text x="100" y="600" font-size="13" font-weight="bold" fill="#14503A">Modelos</text>
  <text x="100" y="616" font-size="11.5" fill="#4A7A64">mapeiam as tabelas do banco (SQLAlchemy)</text>

  <text x="470" y="658" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1B7A4B">Fonte única das regras de negócio</text>

  <!-- ══════════ SQL ══════════ -->
  <line x1="440" y1="670" x2="440" y2="706" stroke="#5A6B7B" stroke-width="2" marker-end="url(#seta)" marker-start="url(#setaInicio)"/>
  <text x="470" y="692" font-size="12" fill="#5A6B7B">SQL</text>

  <!-- ══════════ CAMADA 3 — DADOS ══════════ -->
  <rect x="60" y="712" width="820" height="84" rx="10" fill="#FAF6F2" stroke="#B07A4A" stroke-width="2"/>
  <text x="82" y="740" font-size="15" font-weight="bold" fill="#6B3F16">3. CAMADA DE DADOS</text>
  <text x="82" y="759" font-size="12.5" fill="#8A5A2E">PostgreSQL — 18 tabelas · integridade referencial e restrições de verificação no próprio esquema</text>
  <text x="82" y="780" font-size="12" fill="#8A5A2E">Multilocação por linha: cada registro vinculado ao usuário proprietário; toda consulta filtra pelo usuário autenticado</text>
</svg>
